<!doctype html>
<meta charset="utf-8">
<title>Screenshot</title>
<link rel="stylesheet" href="viewer.css">
<header>
  <div class="meta">
    <strong id="source">Screenshot</strong>
    <span id="dims"></span>
  </div>
  <div class="actions">
    <button id="zoom" class="ghost">Actual size</button>
    <button id="copy" class="ghost">Copy</button>
    <button id="download">Download</button>
  </div>
</header>
<main>
  <img id="shot" alt="Full page screenshot" hidden>
  <p id="empty">Nothing captured yet - click the extension icon on a page.</p>
</main>
<script src="viewer.js"></script>
